name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TaskManager.slnx

      - name: Build
        run: dotnet build TaskManager.slnx -c Release --no-restore

      - name: Test
        run: dotnet test TaskManager.slnx -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  docker-smoke-test:
    name: Docker + PostgreSQL smoke test
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Start API and PostgreSQL
        run: docker compose up --build --detach

      - name: Run smoke test
        run: bash scripts/smoke-test.sh http://localhost:8080

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
